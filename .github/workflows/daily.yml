name: daily

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.config.js
      - scripts/**
      - .github/workflows/daily.yml

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#1d2b53&color_dots=#ebedf0,#ffccaa,#ff77a8,#ff004d,#7e2553
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffec27&color_dots=#161b22,#1d2b53,#7e2553,#ff004d,#ffa300

      - name: Publish to the output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "snake: run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output

  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Rebuild HUD, language XP, trophies and quote of the day
        run: node scripts/build.js --live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          if git diff --staged --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -qm "chore: refresh live profile assets"
          git pull -q --rebase
          git push -q
