<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hollow Rush · jay-patel1337</title>
<meta name="description" content="A retro pixel rooftop runner through Karakura Town at night. Jump, slash Hollows and fire Getsuga Tensho.">
<meta name="theme-color" content="#0b0e1f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Cpath d='M2 0h1v1H2zM5 0h1v1H5zM1 1h6v2H1zM2 3h4v2H2z' fill='%23ffa300'/%3E%3Cpath d='M2 5h4v3H2z' fill='%2316162a'/%3E%3Cpath d='M3 5h1v1H3z' fill='%23ff004d'/%3E%3C/svg%3E">
<style>
  :root { --ink: #0b0e1f; --navy: #1d2b53; --cream: #fff1e8; --yellow: #ffec27; --pink: #ff77a8; --lav: #83769c; --red: #ff004d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--cream); font-family: ui-monospace, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 16px; gap: 10px; overscroll-behavior: none; }
  #wrap { width: 100%; max-width: 1280px; display: flex; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; outline: none;
           box-shadow: 0 0 0 4px #000, 0 0 0 8px var(--cream), 0 0 0 12px #000; touch-action: none; margin: 12px 0; }
  footer { font-size: 12px; color: var(--lav); text-align: center; line-height: 1.7; }
  footer a { color: var(--pink); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  kbd { background: var(--navy); color: var(--cream); border-radius: 3px; padding: 1px 5px; font-size: 11px; }

  #pad { display: none; width: 100%; max-width: 560px; justify-content: space-between; align-items: center; gap: 12px; user-select: none; -webkit-user-select: none; }
  @media (pointer: coarse) { #pad { display: flex; } .desk { display: none; } }
  .btn { border: 3px solid var(--cream); box-shadow: 0 0 0 3px #000; background: var(--navy); color: var(--cream); font: 700 14px ui-monospace, monospace;
         border-radius: 10px; touch-action: none; display: grid; place-items: center; -webkit-tap-highlight-color: transparent; }
  .btn.on { background: var(--cream); color: var(--ink); }
  .jump { width: 120px; height: 72px; }
  .act { display: flex; gap: 12px; align-items: center; }
  .slash { width: 84px; height: 72px; }
  .special { width: 84px; height: 72px; border-color: #29adff; color: #9fe2ff; }
  .small { width: 44px; height: 36px; font-size: 11px; }

  #initials { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(11,14,31,.75); z-index: 5; }
  #initials[hidden] { display: none; }
  #initials .card { background: var(--ink); border: 4px solid var(--cream); box-shadow: 0 0 0 4px #000; padding: 20px 24px; text-align: center; max-width: 90vw; }
  #initials h2 { margin: 0 0 6px; color: var(--yellow); font-size: 18px; letter-spacing: 2px; }
  #initials p { margin: 0 0 14px; color: var(--lav); font-size: 12px; }
  #initials input { width: 5.5ch; font: 700 32px ui-monospace, monospace; text-align: center; text-transform: uppercase; letter-spacing: 6px;
                    background: #000; color: var(--yellow); border: 3px solid var(--pink); padding: 6px 4px; }
  #initials .row { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
  #initials button { font: 700 13px ui-monospace, monospace; padding: 8px 14px; border: 3px solid var(--cream); background: var(--navy); color: var(--cream); cursor: pointer; }
  #initials button[type=submit] { background: var(--red); }
</style>
</head>
<body>
  <div id="wrap"><canvas id="screen" tabindex="0" aria-label="Hollow Rush game screen"></canvas></div>

  <div id="pad" aria-label="Touch controls">
    <button class="btn jump" data-action="jump">JUMP</button>
    <div class="act">
      <button class="btn small" data-action="pause">II</button>
      <button class="btn slash" data-action="slash">SLASH</button>
      <button class="btn special" data-action="special">GETSUGA</button>
    </div>
  </div>

  <footer>
    <div class="desk"><kbd>Space</kbd> jump (twice = Shunpo) · <kbd>X</kbd> slash · <kbd>C</kbd> Getsuga Tensho · <kbd>P</kbd> pause · <kbd>M</kbd> mute</div>
    <div>Fan-made tribute inspired by <i>Bleach</i>. Original pixel art, code and chiptunes by <a href="https://github.com/jay-patel1337">@jay-patel1337</a> · <a href="https://github.com/jay-patel1337/jay-patel1337/tree/main/play">source</a></div>
  </footer>

  <form id="initials" hidden autocomplete="off">
    <div class="card">
      <h2>NEW HIGH SCORE!</h2>
      <p>Enter your initials for the Hall of Fame</p>
      <input id="initials-name" maxlength="3" pattern="[A-Za-z0-9]{1,3}" required aria-label="Your initials" autocapitalize="characters" spellcheck="false">
      <div class="row">
        <button type="button" id="initials-skip">SKIP</button>
        <button type="submit">SAVE</button>
      </div>
    </div>
  </form>

  <script type="module" src="/play/game.js"></script>
</body>
</html>
